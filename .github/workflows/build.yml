name: Build GNOME Sudoku AppImage

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential python3-pip python3-setuptools python3-venv ninja-build pkg-config wget git m4 valac \
            libgee-0.8-dev libjson-glib-dev libqqwing-dev yelp-tools itstool gettext libxml2-utils libxml2-dev \
            desktop-file-utils libgirepository1.0-dev libglib2.0-dev libpango1.0-dev libcairo2-dev libgdk-pixbuf-2.0-dev \
            libepoxy-dev libgraphene-1.0-dev libwayland-dev libx11-dev libxkbcommon-dev libvulkan-dev libffi-dev \
            zlib1g-dev libmount-dev libselinux1-dev libpcre2-dev python3-dev libdbus-1-dev python3-gi file mount sassc \
            libfribidi-dev libfontconfig1-dev libsqlite3-dev libcups2-dev libcolord-dev liblcms2-dev librest-dev libsoup-3.0-dev libcloudproviders-dev
          
      - name: Install Python dependencies
        run: |
          python3 -m venv venv_build
          source venv_build/bin/activate
          pip install --upgrade pip
          pip install meson ninja "setuptools==65.5.0"

      - name: Build dependencies
        run: |
          source venv_build/bin/activate
          bash build_deps.sh

      - name: Build and package Sudoku
        run: |
          source venv_build/bin/activate
          bash build/build-gnome-sudoku-appimage.sh
          
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Sudoku-AppImage
          path: "Sudoku-*.AppImage"
